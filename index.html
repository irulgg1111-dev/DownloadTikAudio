<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownloadTikAudio - TikTok MP3 Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
                DownloadTikAudio
            </h1>
            <p class="text-slate-400 text-sm mt-2">Unduh musik TikTok MP3 dengan cepat</p>
        </div>
        
        <div class="space-y-4">
            <input type="text" id="tiktokUrl" placeholder="Tempel link TikTok di sini..." 
                   class="w-full p-4 rounded-xl bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all">
            <button onclick="downloadMusic()" id="btnDown" class="w-full bg-gradient-to-r from-pink-600 to-violet-600 hover:from-pink-500 hover:to-violet-500 p-4 rounded-xl font-bold transition shadow-lg">
                Dapatkan Audio
            </button>
        </div>

        <div id="loading" class="hidden mt-6 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-pink-500 border-t-transparent"></div>
            <p class="mt-2 text-slate-400">Memproses...</p>
        </div>

        <div id="result" class="mt-8 hidden border-t border-slate-700 pt-6 text-center">
            <img id="musicCover" src="" class="w-32 h-32 mx-auto rounded-full border-4 border-pink-500 shadow-xl animate-spin-slow object-cover mb-4">
            <h3 id="musicTitle" class="font-bold text-lg truncate px-4"></h3>
            <p id="musicAuthor" class="text-slate-400 text-sm mb-6"></p>
            <a id="downloadBtn" href="" target="_blank" class="w-full block bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl font-bold transition">
                Download MP3
            </a>
        </div>
    </div>

    <script>
        async function downloadMusic() {
            const url = document.getElementById('tiktokUrl').value;
            const btn = document.getElementById('btnDown');
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');

            if(!url) return alert("Masukkan link!");
            
            resultDiv.classList.add('hidden');
            loading.classList.remove('hidden');
            btn.disabled = true;
            
            const formData = new FormData();
            formData.append('url', url);

            try {
                const response = await fetch('/fetch', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.audio_url) {
                    document.getElementById('musicTitle').innerText = data.title;
                    document.getElementById('musicAuthor').innerText = data.author;
                    document.getElementById('musicCover').src = data.cover;
                    document.getElementById('downloadBtn').href = data.audio_url;
                    resultDiv.classList.remove('hidden');
                } else { alert("Gagal mengambil data."); }
            } catch (e) { alert("Error sistem."); } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
